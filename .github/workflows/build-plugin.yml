name: Build and release MOS Stream
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: page/package-lock.json
      - name: Test and build without installation
        run: bash scripts/build-local.sh
      - name: Package install ZIP and corresponding source ZIP
        run: bash scripts/package-local.sh
      - name: Retain reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mos-stream-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: local-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mos-stream-build
          path: artifacts
      - name: Publish numeric release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -c 'import json,os; p=json.load(open("artifacts/mos-stream-"+os.environ["TAG"]+"-manifest.json")); assert p["version"]==os.environ["TAG"]'
          gh release create "$TAG" artifacts/* --verify-tag --draft --title "MOS Stream $TAG" --notes "Configurable external Selkies web client in MOS. Saved URL/name and auto-connect, reconnect/disconnect and fullscreen. No backend services or container lifecycle. Includes Debian package, Hub Local bundle, corresponding source and integrity metadata. Local unit/federation/package and fixture browser checks pass; installed MOS and real Selkies playback remain user acceptance checks."
          gh release edit "$TAG" --draft=false --latest
# No MOS installation, host settings change or Hub catalog mutation in CI.
